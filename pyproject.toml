[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow_forecast"
version = "0.1.0"
description = "Cash flow forecasting for PT of the City RCM pilot"
readme = "cashflow_forecast/README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
    "streamlit>=1.28",
    "plotly>=5.18",
]

[project.scripts]
cashflow-forecast = "cashflow_forecast.__main__:main"

[tool.setuptools.packages.find]
include = ["cashflow_forecast*"]
