  # ACH processors (not insurers). Tracker heads only — do not alias to a payer org.
  - code: ACH_PROCESSOR_ECHO
    name: ACH Processor (Echo)
    revflow_payors: []
    aliases:
      - { source: tracker, exact: "HNB ECHO" }
      - { source: tracker, exact: "HNB - ECHO" }
      - { source: tracker, pattern: "HNB\\s*-?\\s*ECHO" }
      - { source: tracker, exact: "PNC-ECHO" }
      - { source: tracker, exact: "PNC ECHO" }
      - { source: tracker, pattern: "PNC[-\\s]*ECHO" }

  - code: ACH_PROCESSOR_PAYPLUS
    name: ACH Processor (PayPlus)
