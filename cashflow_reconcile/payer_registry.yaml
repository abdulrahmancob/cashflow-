      - { source: webpt, pattern: "uhc\\s*choice", product_class: commercial }
      - { source: webpt, pattern: "choice\\s*plus", product_class: commercial }
      - { source: webpt, pattern: "nyce\\s*ppo", product_class: commercial }
      - { source: webpt, pattern: "nyce\\s*hmo", product_class: commercial }
      - { source: webpt, pattern: "oxford", product_class: commercial }
      - { source: webpt, pattern: "united\\s*healthcare", product_class: null }
      - { source: webpt, pattern: "unitedhealthcare", product_class: null }
      - { source: webpt, pattern: "\\buhc\\b", product_class: null }
      - { source: webpt, pattern: "surest", product_class: commercial }
      - { source: webpt, pattern: "aarp", product_class: medicare }
      - { source: revflow, pattern: "UNITED\\s*HEALTHCARE" }
      - { source: revflow, pattern: "UNITED HEALTHCARE" }
      - { source: revflow, exact: "UHC SUREST" }
      - { source: revflow, exact: "UNITEDHEALTHCARE SUREST" }
      - { source: revflow, exact: "OXFORD HEALTH INSURANCE INC" }
      - { source: revflow, exact: "OXFORD HEALTH PLANS LLC" }
      - { source: revflow, exact: "NYC EMPLOYEES PPO PLAN" }
      - { source: revflow, exact: "AARP SUPPLEMENTAL HEALTH PLANS FROM UNITEDHEALTHCARE" }
      - { source: revflow, exact: "UHC HARVARD PILGRIM" }
      - { source: revflow, exact: "NY01 OCNY NEW YORK UHC MA" }
      - { source: tracker, pattern: "UHC" }
      - { source: tracker, pattern: "UNITEDHEALTHCARE" }
      - { source: tracker, pattern: "UNITED HEALTHCARE" }
      - { source: tracker, pattern: "NYC\\s*EMPLOYEE" }
