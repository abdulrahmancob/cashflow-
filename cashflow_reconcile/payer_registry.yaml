# Canonical payer organizations + cross-source aliases.
# Sources: webpt | revflow | tracker
# Prefer exact for RevFlow/Tracker legal names; pattern (case-insensitive regex) for WebPT labels.
payer_orgs:
  - code: FIDELIS
    name: Fidelis Care
    revflow_payors:
      - "NEW YORK NETWORK IPA"
      - "FIDELIS CARE"
      - "AMBETTER FROM FIDELIS CARE"
      - "FIDELIS CAREWELLCARE BY FIDELIS CARE"
      - "FIDELIS CARE/WELLCARE BY FIDELIS CARE"
    aliases:
      - { source: webpt, pattern: "fidelis.?medicaid", product_class: medicaid }
      - { source: webpt, pattern: "fidelis.?medicare", product_class: medicare }
      - { source: webpt, pattern: "fidelis", product_class: null }
      - { source: webpt, pattern: "wellcare", product_class: medicare }
      - { source: webpt, pattern: "ambetter", product_class: medicaid }
      - { source: revflow, exact: "NEW YORK NETWORK IPA" }
      - { source: revflow, exact: "FIDELIS CARE" }
      - { source: revflow, exact: "AMBETTER FROM FIDELIS CARE" }
      - { source: revflow, pattern: "FIDELIS\\s*CARE.*WELLCARE" }
      - { source: tracker, exact: "NYNM" }
      - { source: tracker, pattern: "NYNM\\s*DES" }
      - { source: tracker, pattern: "NEW YORK NETWORK" }

  - code: HEALTHFIRST
    name: Healthfirst
    revflow_payors:
      - "HEALTHFIRST PHSP, INC."
      - "HEALTHFIRST"
      - "HEALTHFIRST MEDICARE"
      - "HEALTHFIRST EARLY START - STAT"
      - "HEALTHFIRST EARLY START-STAT"
      - "HEALTHFIRST COMMERCIAL"
      - "HIX PHSP INDIVIDUAL"
      - "SENIOR HEALTH PARTNERS"
      - "INTEGRATED PRODUCTS"
    aliases:
      - { source: webpt, pattern: "healthfirst.?medicaid", product_class: medicaid }
      - { source: webpt, pattern: "healthfirst.?medicare", product_class: medicare }
      - { source: webpt, pattern: "health\\s*first", product_class: null }
      - { source: webpt, pattern: "healthfirst", product_class: null }
      - { source: revflow, exact: "HEALTHFIRST PHSP, INC." }
      - { source: revflow, exact: "HEALTHFIRST" }
      - { source: revflow, exact: "HEALTHFIRST MEDICARE" }
      - { source: revflow, exact: "HEALTHFIRST EARLY START - STAT" }
      - { source: revflow, exact: "HEALTHFIRST EARLY START-STAT" }
      - { source: revflow, exact: "HEALTHFIRST COMMERCIAL" }
      - { source: revflow, exact: "HIX PHSP INDIVIDUAL" }
      - { source: revflow, exact: "SENIOR HEALTH PARTNERS" }
      - { source: revflow, exact: "INTEGRATED PRODUCTS" }
      - { source: tracker, pattern: "HEALTHFIRST" }

