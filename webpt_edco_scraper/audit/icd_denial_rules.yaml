# ICD-10 denial conflict rules from ICD10_Denial_Management.xlsx Denial Matrix.
# Excel ICD codes are examples; site_maps / bilateral_families generalize them for PT.

# Site-aware symptom ↔ definitive pairs (clinical redundancy / status conflicts).
site_maps:
  joint_pain_oa:
    - id: shoulder
      left_prefixes: ["M25.51"]
      right_prefixes: ["M19.01", "M19.11", "M19.21"]
    - id: hip
      left_prefixes: ["M25.55"]
      right_prefixes: ["M16."]
    - id: knee
      left_prefixes: ["M25.56"]
      right_prefixes: ["M17."]
    - id: ankle_foot
      left_prefixes: ["M25.57"]
      right_prefixes: ["M19.07", "M19.17", "M19.27"]

  joint_pain_prosthetic:
    - id: shoulder
      left_prefixes: ["M25.51"]
      right_prefixes: ["Z96.61"]
    - id: hip
      left_prefixes: ["M25.55"]
      right_prefixes: ["Z96.64"]
    - id: knee
      left_prefixes: ["M25.56"]
      right_prefixes: ["Z96.65"]
    - id: ankle
      left_prefixes: ["M25.57"]
      right_prefixes: ["Z96.66"]

# Unilateral R+L pairs where a bilateral combination code exists.
bilateral_families:
  - id: hip_oa_primary
    right: ["M16.11"]
    left: ["M16.12"]
    bilateral: ["M16.0"]
  - id: hip_oa_dysplasia
    right: ["M16.31"]
    left: ["M16.32"]
    bilateral: ["M16.2"]
  - id: knee_oa_primary
    right: ["M17.11"]
    left: ["M17.12"]
    bilateral: ["M17.0"]
  - id: knee_oa_post_traumatic
    right: ["M17.31"]
    left: ["M17.32"]
    bilateral: ["M17.2"]

rules:
  - id: clinical_redundancy_lbp_disc
    category: "1. Clinical Redundancy"
    severity: error
    description: "Billing LBP (M54.5x) alongside a definitive disc diagnosis (M51.*)."
    correct_approach: "Drop the symptom code. Only bill the definitive disc diagnosis (e.g. M51.26)."
    all_of:
      - any_prefix: ["M54.5"]
      - any_prefix: ["M51."]

  - id: clinical_redundancy_cervicalgia_weakness
    category: "1. Clinical Redundancy"
    severity: error
    description: "Cervicalgia (M54.2) billed with muscle weakness (M62.81)."
    correct_approach: "Drop the symptom code; keep the definitive diagnosis only."
    all_of:
      - exact: ["M54.2"]
      - exact: ["M62.81"]

  - id: clinical_redundancy_joint_pain_oa
    category: "1. Clinical Redundancy"
    severity: error
    description: "Joint pain (M25.5x) billed with site-matched osteoarthritis."
    correct_approach: "Drop the pain code. Bill the OA diagnosis only."
    check: site_pair_map
    site_map: joint_pain_oa

  - id: clinical_redundancy_weakness_cervicalgia
    category: "1. Clinical Redundancy"
    severity: error
    description: "General weakness (R53.1) billed with cervicalgia (M54.2)."
    correct_approach: "Drop the symptom code. Only bill the definitive diagnosis."
    all_of:
      - exact: ["R53.1"]
      - exact: ["M54.2"]

  - id: vestibular_redundancy
    category: "2. Vestibular Redundancy (H-R Conflict)"
    severity: error
    description: "Definitive vestibular disorder (H81*/H83*) combined with dizziness/gait symptom codes."
    correct_approach: "Bill the H-code only. Dizziness and gait issues are integral symptoms of vestibular disorders."
    all_of:
      - any_prefix: ["H81", "H83"]
      - any_of_groups:
          - exact: ["R42"]
          - any_prefix: ["R26"]

  - id: status_vs_acute_prosthetic
    category: "3. Status vs. Acute Conflict"
    severity: error
    description: "Joint pain (M25.5x) billed with site-matched artificial joint status (Z96.6x)."
    correct_approach: "Do not add the Z-code if treating for standard pain. If the Z-code is present, payers expect a T-series complication code."
    check: site_pair_map
    site_map: joint_pain_prosthetic

  - id: lateralization_unspecified_with_side
    category: "4. Lateralization Example"
    severity: error
    description: "Unspecified-side code (...9) billed alongside specific left/right codes with the same stem."
    correct_approach: "Stop using the '9' (unspecified) code. Bill only the side-specific codes."
    check: lateralization_unspecified

  - id: bilateral_oa_split
    category: "5. Bilateral Combination Codes"
    severity: error
    description: "Separate unilateral OA codes (R+L) where a bilateral combination code exists."
    correct_approach: "Use the bilateral combination code instead of separate R/L codes."
    check: bilateral_split

  - id: anatomical_overlap_sciatica_lbp
    category: "6. Anatomical Overlap"
    severity: error
    description: "Sciatica (M54.4*) billed with LBP (M54.5*)."
    correct_approach: "Bill Sciatica (M54.4x) only; it covers the associated back pain."
    all_of:
      - any_prefix: ["M54.4"]
      - any_prefix: ["M54.5"]

  - id: anatomical_overlap_sciatica_leg_pain
    category: "6. Anatomical Overlap"
    severity: error
    description: "Sciatica (M54.4*) billed with leg pain (M79.6*)."
    correct_approach: "Bill Sciatica (M54.4x) only; it covers referred extremity pain."
    all_of:
      - any_prefix: ["M54.4"]
      - any_prefix: ["M79.6"]

  - id: anatomical_overlap_radiculopathy_nerve
    category: "6. Anatomical Overlap"
    severity: error
    description: "Radiculopathy (M54.1*) billed with overlapping nerve/root codes (G54*/G57*)."
    correct_approach: "Bill Radiculopathy or the nerve code only — not both."
    all_of:
      - any_prefix: ["M54.1"]
      - any_of_groups:
          - any_prefix: ["G54"]
          - any_prefix: ["G57"]

  - id: anatomical_overlap_cervicalgia_cervical_radiculopathy
    category: "6. Anatomical Overlap"
    severity: error
    description: "Cervicalgia (M54.2) billed with cervical radiculopathy (M54.12)."
    correct_approach: "Bill cervical radiculopathy only; it covers associated neck pain."
    all_of:
      - exact: ["M54.2"]
      - exact: ["M54.12"]

  - id: invalid_or_nonbillable_icd
    category: "8. Retired Codes"
    severity: error
    description: "ICD code is missing from the CMS catalog or is a non-billable header (e.g. retired M54.5)."
    correct_approach: "Replace with a current billable ICD-10-CM code."
    check: invalid_or_nonbillable
