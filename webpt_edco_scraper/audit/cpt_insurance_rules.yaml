# CPT billing rules by insurance (from CPT codes guid).
# match_patterns: case-insensitive regex against WebPT insurance_name.
# Order matters: first match wins — put more specific rules before broader ones.

strapping_codes:
  - "29200"
  - "29240"
  - "29260"
  - "29280"
  - "29520"
  - "29530"
  - "29540"
  - "29799"
  - "29582"

timed_treatment_codes:
  - "97110"
  - "97112"
  - "97116"
  - "97140"
  - "97530"
  - "97124"

eval_codes:
  - "97161"
  - "97162"
  - "97163"

reeval_code: "97164"
massage_code: "97124"
therapeutic_activity_code: "97530"
estim_97014: "97014"
estim_g0283: "G0283"

rules:
  # --- Healthfirst (all products): o14, no strapping, no re-eval ---
  - name: Healthfirst
    match_patterns:
      - "health\\s*first"
      - "healthfirst"
    estim: "97014"
    strapping: forbidden
    reeval: forbidden
    timed_codes: standard_4cpt
    prefer_manual_over_massage: false

  # --- Emblem Medicaid (before broader Emblem patterns) ---
  - name: Emblem Medicaid
    match_patterns:
      - "emblem\\s*medicaid"
      - "emblem[-\\s]?cmo"
    estim: "97014"
    strapping: accepted
    reeval: allowed
    timed_codes: standard_4cpt
    prefer_manual_over_massage: false

  # --- Emblem GHI / NYCE PPO: strapping required, no massage ---
  - name: Emblem-GHI / NYCE PPO
    match_patterns:
      - "nyce"
      - "emblem[-\\s]?ghi"
      - "^ghi$"
      - "\\bghi\\b"
    estim: "97014"
    strapping: required
    reeval: allowed
    timed_codes: standard_4cpt
    prefer_manual_over_massage: true

  # --- Emblem HIP / HCP / Connecticare ---
  - name: Emblem HIP/HCP
    match_patterns:
      - "emblem[-\\s]?hip"
      - "emblem[-\\s]?hcp"
      - "emblem\\s+hcp"
      - "emblem\\s*health"
      - "connecticare"
    estim: "97014"
    strapping: accepted
    reeval: allowed
    timed_codes: standard_4cpt
    prefer_manual_over_massage: false

  # --- BCBS Health Plus: o14, no strapping ---
  - name: BCBS-Health Plus
    match_patterns:
      - "bcbs[-\\s]?health\\s*plus"
      - "bcbs\\s+health\\s+plus"
      - "health\\s*plus"
    estim: "97014"
    strapping: forbidden
    reeval: allowed
    timed_codes: standard_4cpt
    prefer_manual_over_massage: false

  # --- BCBS Integra (guide: integra = G-Code) ---
  - name: Integra
    match_patterns:
      - "integra"
    estim: "G0283"
    strapping: accepted
    reeval: allowed
    timed_codes: standard_4cpt
    prefer_manual_over_massage: false

  # --- BCBS general (HMO/PPO/Somos/Federal/Medicare under BCBS): o14, no strapping ---
  - name: BCBS
    match_patterns:
      - "bcbs"
      - "blue\\s*cross"
      - "empire\\s*blue"
