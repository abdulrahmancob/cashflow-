# Default: HTTP reverse proxy (works without TLS certs).
# When certificates exist at /data/certs/, also enable cashflow-ssl.conf
# (see deploy/README.md).

upstream cashflow_api {
    server api:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Per address and per session limits; see the zones in nginx.conf.
    limit_req zone=api_ip burst=200 nodelay;
    limit_req zone=api_session burst=60 nodelay;
    limit_req zone=heavy_ip burst=3 nodelay;
    limit_req zone=heavy_session burst=3 nodelay;
    limit_req zone=login_ip burst=10 nodelay;
    limit_conn conn_ip 40;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Sheet downloads poll a background job. Injected without rebuilding the portal.
    location = /export-guard.js {
        root /etc/nginx;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # SPA (rcm_portal dist mounted at /usr/share/nginx/html)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        sub_filter '</head>' '<script src="/export-guard.js"></script></head>';
        sub_filter_once on;
    }

    # All-months sheet export builds the file before the first byte.
    location = /api/eligibility/items/export {
        proxy_pass http://cashflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://cashflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /alive {
        proxy_pass http://cashflow_api/alive;
        access_log off;
    }

    location = /ready {
        proxy_pass http://cashflow_api/ready;
        access_log off;
    }
}
