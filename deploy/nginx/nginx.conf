worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The AWS load balancer is the only thing that talks to nginx. Take the client
    # address from the header it appends; a forged header from a client sits further
    # left and is skipped, because only load balancer addresses are trusted.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limits. Each zone keys on a variable that is empty when the zone does not
    # apply, and an empty key is never counted. The server itself, docker, and the
    # load balancer health checks are exempt.
    geo $limit_exempt {
        default        0;
        127.0.0.1      1;
        172.16.0.0/12  1;
        10.0.0.0/16    1;
    }
    map $limit_exempt $limit_ip {
        1       "";
        default $remote_addr;
    }
    map $limit_exempt $limit_session {
        1       "";
        default $cookie_rcm_session;
    }
    # Exports and upload previews build files: a few a minute. Finance pages fire several
    # cached calls per page load, so they get a wider allowance.
    map $uri $limit_export {
        default 0;
        ~^/api(/v1)?/.+/export(-job)?$ 1;
        ~^/api(/v1)?/.+/upload/preview$ 1;
    }
    map $uri $limit_finance {
        default 0;
        ~^/api(/v1)?/(cash|exec|mission|overdue|unbanked)(/|\.|$) 1;
    }
    map $uri $limit_login {
        default 0;
        ~^/api(/v1)?/auth/login$ 1;
    }
    map "$limit_export$limit_ip" $export_ip {
        ~^1(.+)$ $1;
        default  "";
    }
    map "$limit_export$limit_session" $export_session {
        ~^1(.+)$ $1;
        default  "";
    }
    map "$limit_finance$limit_ip" $finance_ip {
        ~^1(.+)$ $1;
        default  "";
    }
    map "$limit_finance$limit_session" $finance_session {
        ~^1(.+)$ $1;
        default  "";
    }
    map "$limit_login$limit_ip" $login_ip {
        ~^1(.+)$ $1;
        default  "";
    }

    limit_req_zone $limit_ip zone=api_ip:10m rate=60r/s;
    limit_req_zone $limit_session zone=api_session:20m rate=15r/s;
    limit_req_zone $export_ip zone=export_ip:5m rate=6r/m;
    limit_req_zone $export_session zone=export_session:5m rate=6r/m;
    limit_req_zone $finance_ip zone=finance_ip:5m rate=60r/m;
    limit_req_zone $finance_session zone=finance_session:5m rate=60r/m;
    # A whole office signs in at shift start; the app locks out guessing per account and address.
    limit_req_zone $login_ip zone=login_ip:5m rate=30r/m;
    limit_conn_zone $limit_ip zone=conn_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    log_format main_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"lb_addr":"$realip_remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"limit":"$limit_req_status",'
        '"conn_limit":"$limit_conn_status",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Slow or idle clients release their connection quickly.
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Uploads raise this in their own location. The all-months export keeps 3600s there.
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    include /etc/nginx/conf.d/*.conf;
}
